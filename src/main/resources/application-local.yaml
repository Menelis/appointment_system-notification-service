infrastructure:
  env: local

spring:
  application:
    name: notification-service
  cloud:
    config:
      enabled: false
  kafka:
    bootstrap-servers:
      - localhost:9092
      - localhost:9093
      - localhost:9094
      - localhost:9095
      - localhost:9096
      - localhost:9097
    consumer:
      enable-auto-commit: false
      isolation-level: read_committed
      group-id: ${infrastructure.env}-appointment-notification-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
      max-poll-records: 10
      properties:
        max.poll.interval.ms: 600000
    listener:
      ack-mode: manual_immediate
      concurrency: 1
      auto-startup: true
    properties:
      security.protocol: PLAINTEXT
      sasl.mechanism: PLAIN
  # Service intercommunication
  grpc:
    client:
      channel:
        auth-service:
          target: "static://localhost:9090"
        branch-service:
          target: "static://localhost:9091"
        appointment-service:
          target: "static://localhost:9089"

  mail:
    host: smtp.gmail.com
    port: 587
    username: ""
    password: ""
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.debug: true
app:
  app-url: http://localhost:4200 # Hash Routing work around
  kafka:
    consumer:
      topic:
        name: ${infrastructure.env}-appointment-notifications
        topic-header-filter:
          header-key: eventType
          header-values:
            - verifyEmail
            - bookingConfirmed
            - bookingPendingConfirmed
            - bookingCancelled
            - passwordReset

  mail:
    from-address: ${spring.mail.username}
  email-template:
    verify-email-template: Hi %s,<br/><br/> Welcome to Appointment System.To complete registration process click <a href='%s'>here</a> to verify your account.<br/></br/><br/><br/> %s
    reset-password-email-template: Hi %s,<br/><br/> We have received your request to reset your password.Please click <a href='%s'>here</a> to reset your password.<br/></br/><br/> %s


server:
  port: 9007
logging:
  level:
    root: info
    co.appointment: trace
